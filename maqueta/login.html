<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="body_quienes_somos dark-mode vista-autenticacion">
    <header class="header_quienes_somos">
        <nav class="navbar_global">
            <a class="home_quienes_somos" href="index.html">
                <img src="img/logo_icon.png" alt="Logo SinerTech">
                <span>SinerTech</span>
            </a>
        </nav>
    </header>
    <main class="contenido_quienes_somos login-main-container">
        <section class="container-fluid login-section">
            <div class="row g-0 w-100 h-100 align-items-stretch">
                <div class="col-md-7 d-none d-md-block p-0">
                    <div class="login-bg-image bg-img-login"></div>
                </div>
                <div class="col-md-5 seccion_hero login-form-col">
                    <div class="w-100 mx-auto login-form-wrapper">
                        <h1 class="text-center mb-4">Iniciar Sesión</h1>
                        <form class="form_panel_admin" method="POST">
                            <div class="row">
                                <div class="col-md-6 mb-3 text-start">
                                    <label class="form-label" for="login_rol">Seleccionar Rol</label>
                                    <select class="form-select" name="login_rol" id="login_rol" required>
                                        <option value="">Seleccionar</option>
                                        <option value="admin">Administrador</option>
                                        <option value="supervisor">Supervisor</option>
                                        <option value="operario">Operario</option>
                                    </select>
                                </div>
                                <div class="col-md-10 alert alert-info d-flex align-items-center" role="alert">
                                    <i class="fa-solid fa-circle-info me-2"></i>
                                    <div class="texto-informativo">
                                        Selecciona tu rol asignado correctamente.
                                    </div>
                                </div>
                                <div class="col-md-12 mb-3 text-start">
                                    <label for="email" class="form-label">Email</label>
                                    <input class="form-control" type="email" name="email" id="email" required>
                                </div>
                                <div class="col-md-12 mb-3 text-start">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input class="form-control" type="password" name="password" id="password" required>
                                </div>
                                <div class="acciones_crud mt-2">
                                    <button type="submit" class="w-100">
                                        Ingresar
                                    </button>
                                </div>
                            </div>
                        </form>
                        <div class="text-center mt-4">
                            <small class="texto-secundario">
                                ¿No tenés cuenta? <a href="registro.html" class="enlace-primario">Registrate</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer_quienes_somos">
        <img src="img/logo_full.jpg" alt="SinerTech">
        <p>© 2026 <span>SinerTech</span>. Todos los derechos reservados.</p>
        <p>
            Hecho por el equipo SinerTech. <strong>Transformamos ideas
                en soluciones reales.</strong>
        </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
